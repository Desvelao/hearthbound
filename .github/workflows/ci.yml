name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # docker-compose.yml declares the Gradle cache as an external volume (shared with another project locally).
      - name: Create the Gradle cache volume
        run: docker volume create brain-training-androind_gradle-cache
      - name: Build the toolchain image
        run: docker compose build
      - name: Check the pixel art
        # --user, not -e UID: compose reads ${UID} from the host shell (unexported in bash), so -e never changed the user.
        run: docker compose run --rm --user "$(id -u):$(id -g)" dev python3 -I tools/sprites.py --check
      - name: Build, test, lint
        run: docker compose run --rm --user "$(id -u):$(id -g)" dev ./gradlew :core:domain:test testDebugUnitTest lint assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
